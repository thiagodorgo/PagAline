version: 1.0
runtime: nodejs22

build:
  commands:
    pre-build:
      - npm ci
    build:
      - npm run build

run:
  runtime-version: 22
  command: npm start
  network:
    port: 8080
  env:
    - name: NODE_ENV
      value: production
  secrets:
    - name: DATABASE_URL
      value-from: arn:aws:secretsmanager:sa-east-1:123456789012:secret:pagaline/prod/database-url
